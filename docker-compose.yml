name: terminal

services:
  # Zellij 的网页终端，前面是容器内的 nginx：Zellij 只听 127.0.0.1:8082，nginx 在 8080 上接核心网关的请求，
  # 两者同一个网络命名空间。数据卷放 Zellij 的会话快照、令牌库和 SSH 密钥。
  web:
    image: ghcr.io/geraldpeng6/wonton-terminal:0.1.0@sha256:37eeef1f7a41dcb40b668013fc1bcca8e4ae06fae462409cc982601a2170aa0b
    user: "${PUID}:${PGID}"
    # ssh 到局域网主机、会话里跑的程序要出网：内部网络到不了外网和局域网。
    # 声明 network.egress 后，核心的出口代理变量也会注入进来，ssh 自己不读它们，走直连。
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/data:/data
    # docker 自带的 tini：zellij 起的会话进程跟着它回收。
    init: true
    # 终端里可能跑构建这类长进程，给足会话数；进程数不设上限时一个 fork 循环能把宿主拖死。
    pids_limit: 1024
    # 停容器时先让 zellij 把会话存下来。
    stop_grace_period: 20s
    healthcheck:
      # 经 nginx 真的请求到 Zellij，nginx 或 Zellij 任一个没起来都会失败。
      # 入口页是启动时生成的，页面没就绪不算健康。
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8080/healthz && test -s /tmp/landing.html"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.7"
  id: dev.zellij.terminal
  version: 0.1.1
  kind: app
  title: { en: Zellij }
  description:
    zh: 在浏览器里打开服务器上的终端，也能 SSH 到局域网里的其他机器
    en: A terminal on your server in the browser, and SSH to other machines on your LAN
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/terminal.png, screenshots/landing.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://zellij.dev
  license: MIT
  tags:
    zh: [工具, 开发]
    en: [Tools, Developer]
  about:
    zh: |
      服务器上的终端，在浏览器里用。Zellij 自己管会话：切到别的 App、关掉页面都能接回原来的会话，会话断了也能恢复。
      手机上有专门的界面：可滚动的终端、快捷键条、窗格和标签切换、屏幕键盘。

      装好后第一次打开会给一条登录令牌和一个 SSH 公钥。令牌进终端用，也留给命令行客户端；
      公钥加到局域网目标主机的 authorized_keys，就能从终端里 ssh 过去，主机指纹首次连接时自己核对。

      容器里是普通用户，没有宿主 root，不带 Docker socket。
    en: |
      A terminal on your server, in the browser. Zellij keeps the sessions itself: switching apps or closing the page
      leads back to the same session, and exited sessions come back. The phone gets a dedicated interface: scrolling,
      a key bar, pane and tab pickers, an on-screen keyboard.

      The first open shows a login token and an SSH public key. The token gets you into the terminal and works with the
      command line client; add the public key to authorized_keys on the LAN host and ssh to it from the terminal,
      checking the host fingerprint on first connect.

      The container runs an ordinary user, without host root or the Docker socket.
  release_notes:
    zh: 清单补 pids_limit，spec 跟到 0.7；商店截图换成 iOS 模拟器的。
    en: "Manifest gains pids_limit and spec 0.7; store screenshot from the iOS simulator."
  webui:
    service: web
    port: 8080
  tabs:
    - id: terminal
      title: { zh: 终端, en: Terminal }
      icon: tabs/terminal.svg
      icon_selected: tabs/terminal-fill.svg
      path: /
      # 终端要整屏：全屏打开，内容由 App 让开状态栏和 Home 条（inset）。
      display: fullscreen
  permissions: [network.egress]
  requirements:
    arch: [amd64, arm64]
    # 空闲时约 30M，一个会话几十 M 起：按能开几个会话的余量给。
    memory: 128M
