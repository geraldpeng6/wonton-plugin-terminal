name: terminal

services:
  # Zellij 的网页终端，前面是容器内的 nginx：Zellij 只听 127.0.0.1:8082，nginx 在 8080 上接核心网关的请求，
  # 两者同一个网络命名空间。数据卷放 Zellij 的会话快照、令牌库和 SSH 密钥。
  web:
    image: ghcr.io/geraldpeng6/wonton-terminal:0.2.0@sha256:180bc7331df25cb23c9f7ecdece0531a52fda4bade508889a90772e4505b082a
    user: "${PUID}:${PGID}"
    # ssh 到局域网主机、会话里跑的程序要出网：内部网络到不了外网和局域网。
    # 声明 network.egress 后，核心的出口代理变量也会注入进来，ssh 自己不读它们，走直连。
    environment:
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/data:/data
    # docker 自带的 tini：zellij 起的会话进程跟着它回收。
    init: true
    # 终端里可能跑构建这类长进程，给足会话数；进程数不设上限时一个 fork 循环能把宿主拖死。
    pids_limit: 1024
    # 停容器时先让 zellij 把会话存下来。
    stop_grace_period: 20s
    healthcheck:
      # 经 nginx 真的请求到 Zellij，nginx 或 Zellij 任一个没起来都会失败。
      # 入口页是启动时生成的，页面没就绪不算健康。
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8080/healthz && test -s /tmp/landing.html"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.11"
  id: dev.zellij.terminal
  version: 0.2.0
  kind: app
  title: { en: Zellij }
  description:
    zh: 在浏览器里以 root 登录这台服务器自己的 shell
    en: Root shell on the host itself, in the browser
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/terminal.png, screenshots/terminal-dark.png, screenshots/landing.png, screenshots/landing-dark.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://zellij.dev
  license: MIT
  tags:
    zh: [工具, 开发]
    en: [Tools, Developer]
  about:
    zh: |
      浏览器里的终端，连的是这台服务器本身：以 root 走宿主自己的 sshd。插件自己生成一把专用密钥，
      私钥只在插件卷里；装好后把入口页上的那一行命令在宿主上执行，或者手动把公钥加进 root 的
      ~/.ssh/authorized_keys。

      等于把宿主的 root 交给这个插件：容器本身不加特权、不进宿主 PID、不挂 Docker socket、不挂宿主根目录，
      只有网络上的 ssh。地址默认是宿主在插件网络里的网关，也可以自己填别的机器和端口。

      Zellij 管会话：切走再回来还在，退出也能恢复；手机上有触屏界面、快捷键条和屏幕键盘。
    en: |
      A terminal in the browser, connected to this server itself: root over the host's own sshd. The plugin
      generates a dedicated key whose private half stays in the plugin volume; after install, run the one
      command on the entry page on the host, or add the public key to root's ~/.ssh/authorized_keys yourself.

      This hands the host's root to the plugin. The container itself is not privileged, shares no PID
      namespace or Docker socket and mounts no host root: everything goes over network ssh. The address
      defaults to the host's address on the plugin network, and you can point it at another machine or port.
  setup:
    zh: 在宿主上用 root 执行入口页那条 echo … >> ~/.ssh/authorized_keys（或手动加公钥）。
    en: "As root on the host, run the echo … >> ~/.ssh/authorized_keys line from the entry page (or add the key by hand)."
  release_notes:
    zh: 改成以 root 登录宿主本身；地址可填，连接失败分类说明，密钥可撤销和重新生成。
    en: "Now root on the host itself; editable address, classified connection failures, revocable and regenerable key."
  webui:
    service: web
    port: 8080
  tabs:
    - id: terminal
      title: { zh: 终端, en: Terminal }
      icon: tabs/terminal.svg
      icon_selected: tabs/terminal-fill.svg
      path: /
      # 终端要整屏：内容由 App 让开状态栏和 Home 条（inset）。
    - id: connect
      title: { zh: 连接, en: Connect }
      icon: tabs/key.svg
      icon_selected: tabs/key-fill.svg
      path: /wonton
  permissions: [network.egress]
  requirements:
    arch: [amd64, arm64]
    # 空闲时约 30M，一个会话几十 M 起：按能开几个会话的余量给。
    memory: 128M
